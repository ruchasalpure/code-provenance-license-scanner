spec_version: "0.1.0"
name: code-provenance-license-scanner
version: 1.0.0
description: Performs deep AST-level snippet provenance matching and SPDX license compatibility resolution across monorepos and container images.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - spdx-compatibility-audit
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/code-provenance-license-scanner"
